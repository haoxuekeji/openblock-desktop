name: Build Test App

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'CHANGE.md'
      - 'doc/*'

env:
  # gui 的 postinstall（setup-local-deps）在 CI 上没有本地多仓可同步，显式跳过
  OPENBLOCK_SKIP_LOCAL_DEPS: 1

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Npm Install
        # lock 里 GitHub 依赖被 npm 规范化成 git+ssh，CI 无密钥，重写为匿名 https
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          npm ci

      - name: Fetch external resources
        # fetch:exts（sync-local-resources.js）从相邻目录 ../external-resources-v3 拷贝
        shell: bash
        run: git clone --depth=1 https://github.com/haoxuekeji/external-resources.git ../external-resources-v3

      - name: Compile
        shell: bash
        env:
          GA_ID: ${{ secrets.GA_ID }}
          NODE_ENV: production
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          set -o pipefail
          { npm run clean && npm run compile; } 2>&1 | tee /tmp/compile.log || {
            echo "::error title=compile::$(tail -c 2500 /tmp/compile.log | tr '\n' '  ')"
            exit 1
          }

      - name: Fetch runtime resources
        shell: bash
        run: |
          set -o pipefail
          npm run fetch:all 2>&1 | tee /tmp/fetch.log || {
            echo "::error title=fetch::$(tail -c 2500 /tmp/fetch.log | tr '\n' '  ')"
            exit 1
          }

      - name: Package
        shell: bash
        env:
          GA_ID: ${{ secrets.GA_ID }}
          NODE_ENV: production
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          set -o pipefail
          npm run doBuild -- --mode=dist 2>&1 | tee /tmp/package.log || {
            echo "::error title=package::$(tail -c 2500 /tmp/package.log | tr '\n' '  ')"
            exit 1
          }

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HXBlock-Desktop-win
          path: dist/HXBlock-Desktop*.exe
          retention-days: 1

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Npm Install
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          npm ci

      - name: Fetch external resources
        run: git clone --depth=1 https://github.com/haoxuekeji/external-resources.git ../external-resources-v3

      - name: Compile
        env:
          GA_ID: ${{ secrets.GA_ID }}
          NODE_ENV: production
          NODE_OPTIONS: --max_old_space_size=8192
        run: |
          set -o pipefail
          { npm run clean && npm run compile; } 2>&1 | tee /tmp/compile.log || {
            echo "::error title=compile::$(tail -c 2500 /tmp/compile.log | tr '\n' '  ')"
            exit 1
          }

      - name: Fetch runtime resources
        run: |
          set -o pipefail
          npm run fetch:all 2>&1 | tee /tmp/fetch.log || {
            echo "::error title=fetch::$(tail -c 2500 /tmp/fetch.log | tr '\n' '  ')"
            exit 1
          }

      - name: Package
        env:
          GA_ID: ${{ secrets.GA_ID }}
          NODE_ENV: production
          NODE_OPTIONS: --max_old_space_size=8192
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          set -o pipefail
          npm run doBuild -- --mode=dist 2>&1 | tee /tmp/package.log || {
            echo "::error title=package::$(tail -c 2500 /tmp/package.log | tr '\n' '  ')"
            exit 1
          }

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HXBlock-Desktop-linux
          path: |
            dist/HXBlock-Desktop*.AppImage
            dist/HXBlock-Desktop*.deb
          retention-days: 1
