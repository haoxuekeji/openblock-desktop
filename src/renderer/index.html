<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            background-color: #4D97FF;
        }

        .splash {
            color: white;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: xx-large;
            font-weight: bolder;
            margin: 0;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>
    <div id="app">
        <p class="splash">HXBlock is loading...</p>
    </div>
</body>
<script>
    // Platform API base. Override at runtime by editing this file, or by
    // setting window.OpenBlockPlatformHost before the GUI boots.
    // Note: www.haoxuekeji.com serves the marketing site only; the learn
    // subdomain hosts the platform SPA and its /api/v1 backend.
    var PLATFORM_HOST = 'https://learn.haoxuekeji.com';

    window.OpenBlockPlatformHost = PLATFORM_HOST;
    // Prefer the embedded Link resource server on desktop.
    window.OpenBlockExternalResourcesBase = 'http://127.0.0.1:20112/';
    window.OpenBlockTtsEndpoint = PLATFORM_HOST + '/api/v1/tts';
    window.OpenBlockAsrEndpoint = PLATFORM_HOST + '/api/v1/asr';
    window.OpenBlockAiChatEndpoint = PLATFORM_HOST + '/api/v1/ai-chat';

    window.scratchConfig = {
        logo: {
            show: true,
            handleClickLogo: function () {}
        },
        menuBar: {
            color: 'hsla(215, 100%, 65%, 1)',
            newButton: { show: true, handleBefore: function () { return true; } },
            loadFileButton: { show: true, handleBefore: function () { return true; } },
            saveFileButton: { show: true, handleBefore: function () { return true; } },
            libButton: { show: true },
            helpButton: { show: true }
        },
        shareButton: { show: false },
        // "My works" browser: lists the logged-in user's platform projects
        // (window.scratch.openMyWorks is registered by the GUI container).
        profileButton: {
            show: true,
            buttonName: '我的作品',
            handleClick: function () {
                if (window.scratch && window.scratch.openMyWorks) {
                    window.scratch.openMyWorks();
                }
            }
        },
        // Python entry: preferred experience is the platform playground in
        // a dedicated window (Monaco editor, examples, cloud sandbox and
        // local execution through Link). When the platform page cannot be
        // loaded the main process signals back and we fall back to the
        // built-in local runner modal (window.scratch.openPythonRunner).
        guideButton: {
            show: true,
            buttonName: 'Python',
            handleClick: function () {
                try {
                    window.require('electron').ipcRenderer.send('open-python-playground-window');
                } catch (e) {
                    if (window.scratch && window.scratch.openPythonRunner) {
                        window.scratch.openPythonRunner();
                    }
                }
            }
        },
        handleVmInitialized: function (vm) {
            window.vm = vm;
        },
        handleProjectLoaded: function () {},
        handleDefaultProjectLoaded: function () {},
        handleProjectIdChange: function () {},
        handleUpdateProjectTitle: function () {},
        mobilePlayer: false,
        // Platform-hosted user assets (custom costumes/sounds of cloud
        // projects). Bundled library assets still resolve locally first via
        // ElectronStorageHelper, which has higher store priority.
        assetCDN: PLATFORM_HOST,
        projectHost: PLATFORM_HOST + '/api/v1/scratch/project',
        backpackHost: PLATFORM_HOST + '/api/v1/scratch/backpack',
        // Enable the Sign-in menu; ScratchDesktopGUIHOC wires the actual login.
        login: true,
        isPlayerOnly: false,
        enableCommunity: false,
        arduino: true,
        canSave: true
    };

    // The main process destroys the playground window and emits this event
    // when the platform page cannot be reached; use the offline-capable
    // local runner modal instead.
    try {
        window.require('electron').ipcRenderer.on('python-playground-unavailable', function () {
            if (window.scratch && window.scratch.openPythonRunner) {
                window.scratch.openPythonRunner();
            }
        });
    } catch (e) {
        // not running inside electron; nothing to wire up
    }
</script>

</html>
