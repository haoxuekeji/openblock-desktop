directories:
  buildResources: buildResources
  output: dist
# Native modules are prebuilt / electron-rebuild'd for the target Electron;
# skip the slow (and often hanging) npm rebuild during packaging.
npmRebuild: false
# Native BLE bindings (N-API prebuilds, dependency of openblock-link)
# cannot be loaded from inside the asar archive.
asarUnpack:
  - "**/node_modules/@stoprocent/**"
extraFiles: ['LICENSE', 'LICENSE.ScratchFoundation', 'TRADEMARK', "tools", "external-resources", 'firmwares', "drivers"]

appId: haoxuekeji.com.hxblock-desktop
productName: "HXBlock Desktop"
publish:
  - provider: github

fileAssociations:
  ext: ob
  name: HXBlock project file
  role: Editor
  icon: buildResources/OpenBlockFile.ico

mac:
  category: public.app-category.education
  entitlements: buildResources/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: >-
        This app requires camera access when using the video sensing blocks.
    NSMicrophoneUsageDescription: >-
        This app requires microphone access when recording sounds or detecting loudness.
  gatekeeperAssess: true
  hardenedRuntime: true
  icon: buildResources/hx-logo.icns
  provisioningProfile: embedded.provisionprofile
  artifactName: "HXBlock-Desktop_${version}.${ext}"
  target:
    - dmg
    # - mas
dmg:
  title: "HXBlock-Desktop_${version}"
# mas:
#   category: public.app-category.education
#   entitlements: buildResources/entitlements.mas.plist
#   entitlementsInherit: buildResources/entitlements.mas.inherit.plist
#   hardenedRuntime: false
#   icon: buildResources/OpenBlockDesktop.icns
# masDev:
#   type: development
#   provisioningProfile: mas-dev.provisionprofile

win:
  icon: buildResources/hx-logo.ico
  target:
    # - appx
    - nsis
# appx:
#   identityName: "OpenblockTeam.OpenblockDesktop
#   publisherDisplayName: "OpenBlock Team"
#   publisher: "CN=2EC43DF1-469A-4119-9AB9-568A0A1FF65F"
#   artifactName: "OpenBlock ${version}.${ext}"
nsis:
  oneClick: false # allow user to choose per-user or per-machine
  allowToChangeInstallationDirectory: true
  include: buildResources/installer.nsh
#   license: LICENSE
  artifactName: "HXBlock-Desktop_${version}.${ext}"

linux:
  category: Education
  icon: buildResources/hx-logo.png
  artifactName: "HXBlock-Desktop_${version}.${ext}"
  desktop:
    Name: HXBlock Desktop
    Comment: HXBlock graphical programming for kids
    Categories: Education;Development;
  target:
    - AppImage
    - deb
    - dir
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
appImage:
  artifactName: "HXBlock-Desktop_${version}.${ext}"
